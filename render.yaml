services:
  - type: web
    name: investment-tracker-api
    runtime: image
    image:
      url: ghcr.io/ramirosclerandi/investment-tracker-api:latest
    plan: free
    region: virginia
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: JOB_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
