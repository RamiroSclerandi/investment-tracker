services:
  postgres:
    # The major tracks production; change POSTGRES_VERSION in .env once the version spike lands.
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-investment_tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-investment_tracker}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./apps/web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-test:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      # Keeps the container venv away from the host's Windows .venv inside the bind mount.
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      # The image ships the latest 3.14.x it has built, which can trail the patch pinned in .python-version.
      UV_PYTHON: "3.14"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-investment_tracker}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "uv sync --frozen && uv run pytest -q"

volumes:
  postgres-data:
