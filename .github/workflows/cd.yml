name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push the api image
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/investment-tracker-api"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$REPOSITORY_URL" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$image:$SHA" -t "$image:latest" apps/api
          docker push "$image:$SHA"
          docker push "$image:latest"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$SHA")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Pushed $ref" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run migrations from the pushed image
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Secret MIGRATIONS_DATABASE_URL is not set in the production environment."
            exit 1
          fi
          docker run --rm -e DATABASE_URL -e ENVIRONMENT=production "$IMAGE_REF" alembic upgrade head

  deploy:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the Render deploy and wait until it is live
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [[ -z "$HOOK_URL" || -z "$RENDER_API_KEY" ]]; then
            echo "::error::Secrets RENDER_DEPLOY_HOOK_URL and RENDER_API_KEY must be set in the production environment."
            exit 1
          fi
          service_id="$(sed -E 's#^https://api\.render\.com/deploy/(srv-[a-z0-9]+).*#\1#' <<<"$HOOK_URL")"
          image_param="$(jq -rn --arg v "$IMAGE_REF" '$v|@uri')"
          response="$(curl -fsS -X POST "$HOOK_URL&imgURL=$image_param")"
          deploy_id="$(jq -r '.deploy.id // empty' <<<"$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render queued the deploy behind another one and returned no deploy id."
            exit 1
          fi
          for _ in $(seq 60); do
            status="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" | jq -r '.status')"
            echo "Deploy $deploy_id: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended as $status."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $deploy_id was not live after 10 minutes."
          exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check through the Vercel rewrite
        env:
          WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: |
          if [[ -z "$WEB_URL" ]]; then
            echo "::error::Repository variable PROD_WEB_URL is not set."
            exit 1
          fi
          for _ in $(seq 30); do
            body="$(curl -sS --max-time 20 "$WEB_URL/api/v1/healthz" || true)"
            if [[ "$(jq -r '.status // empty' <<<"$body" 2>/dev/null)" == "ok" ]]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WEB_URL/api/v1/healthz did not return {\"status\":\"ok\"} within 5 minutes."
          exit 1
